# NOTE: no amcl block on purpose. map -> odom comes from the PC's
# open3d_loc localizer; odom -> base_link comes from FAST-LIO (TF + /odom).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: bim            # BIM frame; bim -> map is a fixed alignment (see launch)
    robot_base_frame: base_link
    odom_topic: /odom            # FAST-LIO odometry from the PC (not the Go2's leg odom)
    transform_tolerance: 0.5     # TF crosses WiFi at ~10 Hz
    bt_loop_duration: 10
    default_server_timeout: 20
    # Humble: the Foxy ChangeGoal workaround (default_bt_xml_filename +
    # plugin_lib_names) was removed on purpose. Humble ships its own default
    # trees and plugin list, and the old Foxy plugin list lacks plugins
    # Humble's trees need (e.g. compute_path_through_poses).

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0   # FAST-LIO odometry arrives at 10 Hz
    odom_topic: /odom            # Humble: controller_server subscribes to odom directly
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15
      stateful: true

    # DWB handles the moment-to-moment dodging of anything the lidar sees
    # that isn't in the BIM (people, boxes, a closed door).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4        # 0.4 / 0.6 are the speeds proven over WiFi in the FAST-LIO handoff
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 10 #20
      vy_samples: 1
      vtheta_samples: 10 #20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"  # TUNE: real Go2 footprint
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_2d   # our LaserScan; the PC's /scan is a PointCloud2, so a different name
          data_type: "LaserScan"
          marking: true
          clearing: true
          # FAST-LIO's odom frame has z=0 at the lidar's start height, so the
          # body-height scan sits BELOW z=0 there. The default min (0.0)
          # silently discards every obstacle -> permanently empty costmap.
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          obstacle_range: 6.0
          raytrace_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: bim            # BIM frame, same as the map_server's frame_id
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"  # TUNE: real Go2 footprint
      # Layer order matters: static (BIM) first, then the live obstacle
      # layer, then inflation. This is the "BIM is ground truth, lidar adds
      # anything extra" behaviour.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_2d   # our LaserScan; the PC's /scan is a PointCloud2, so a different name
          data_type: "LaserScan"
          marking: true
          clearing: true
          # FAST-LIO's odom frame has z=0 at the lidar's start height, so the
          # body-height scan sits BELOW z=0 there. The default min (0.0)
          # silently discards every obstacle -> permanently empty costmap.
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          obstacle_range: 6.0
          raytrace_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # supplied at launch via the 'map' launch argument
    frame_id: bim       # the BIM map lives in the bim frame

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false   # don't route through unmapped space - the BIM is ground truth

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom           # name read by Humble per the FAST-LIO handoff
    local_costmap_frame: odom    # newer-Nav2 name; ignored if undeclared
    global_costmap_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# Humble's navigation_launch.py also starts these three nodes.
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# Humble routes controller output cmd_vel_nav -> velocity_smoother -> /cmd_vel,
# which is what cmd_vel_bridge listens on. Limits mirror the DWB limits above.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.6]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0